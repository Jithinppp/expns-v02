<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#201F1F" />
    <meta name="robots" content="noindex" />
    <title>Expns</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23CEF62E'/%3E%3Cpath d='M20 33.5l8.5 8.5L45 22' fill='none' stroke='%23171717' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #201f1f;
        --deep: #171616;
        --surface: #2a2929;
        --lime: #cef62e;
        --green: #30e48d;
        --red: #ff7a6b;
        --ink: #171717;
        --text: #ffffff;
        --muted: rgba(255, 255, 255, 0.62);
        --dim: rgba(255, 255, 255, 0.4);
        --border: rgba(255, 255, 255, 0.08);
        --lime-soft: rgba(206, 246, 46, 0.14);
        --red-soft: rgba(255, 122, 107, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background-color: var(--bg);
        background-image: radial-gradient(
          120% 90% at 50% -10%,
          rgba(206, 246, 46, 0.07),
          transparent 60%
        );
        color: var(--text);
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      .shell {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .wordmark {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .wordmark em {
        font-style: normal;
        color: var(--lime);
      }

      .card {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 32px 28px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 28px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      }

      .badge {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--lime-soft);
        color: var(--lime);
      }

      .badge svg {
        width: 30px;
        height: 30px;
      }

      .badge.ok {
        background: var(--lime);
        color: var(--ink);
        box-shadow: 0 8px 28px rgba(206, 246, 46, 0.25);
      }

      .badge.err {
        background: var(--red-soft);
        color: var(--red);
      }

      h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }

      p {
        margin: 0;
        font-size: 15px;
        line-height: 1.55;
        color: var(--muted);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 8px;
        padding: 16px 24px;
        border-radius: 999px;
        background: var(--lime);
        color: var(--ink);
        font-family: inherit;
        font-size: 16px;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 10px 30px rgba(206, 246, 46, 0.18);
        transition: transform 120ms ease, filter 120ms ease;
      }

      .btn:hover {
        filter: brightness(1.06);
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn:focus-visible {
        outline: 2px solid var(--lime);
        outline-offset: 3px;
      }

      .btn[hidden] {
        display: none;
      }

      button.btn {
        border: 0;
        cursor: pointer;
      }

      button.btn:disabled {
        opacity: 0.6;
        cursor: default;
        transform: none;
        filter: none;
      }

      form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 4px;
        text-align: left;
      }

      form[hidden] {
        display: none;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .field label {
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }

      .field input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.22);
        color: var(--text);
        font-family: inherit;
        font-size: 16px;
        outline: none;
        transition: border-color 120ms ease, box-shadow 120ms ease;
      }

      .field input::placeholder {
        color: var(--dim);
      }

      .field input:focus {
        border-color: var(--lime);
        box-shadow: 0 0 0 3px rgba(206, 246, 46, 0.14);
      }

      .form-error {
        font-size: 13px;
        color: var(--red);
      }

      .form-error[hidden] {
        display: none;
      }

      .hint {
        font-size: 13px;
        color: var(--dim);
      }

      .hint[hidden] {
        display: none;
      }

      .foot {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="wordmark">Expns<em>.</em></div>

      <section class="card" aria-live="polite">
        <div class="badge" id="badge" aria-hidden="true"></div>
        <h1 id="title">Verify your email</h1>
        <p id="body">This page handles email links from Expns. Open the link from your inbox.</p>

        <form id="reset-form" hidden novalidate>
          <div class="field">
            <label for="password">New password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="new-password"
              placeholder="At least 6 characters"
            />
          </div>
          <div class="field">
            <label for="confirm">Confirm password</label>
            <input
              id="confirm"
              name="confirm"
              type="password"
              autocomplete="new-password"
              placeholder="Repeat your new password"
            />
          </div>
          <p class="form-error" id="form-error" role="alert" hidden></p>
          <button class="btn" id="save" type="submit">Save new password</button>
        </form>

        <a class="btn" id="open-app" hidden>Open Expns</a>
        <p class="hint" id="hint" hidden></p>
      </section>

      <div class="foot">Expns · track smarter</div>
    </main>

    <!-- Pinned to the version the app uses (package.json). -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
    <script>
      (function () {
        // Project config. The publishable key is safe to expose in a browser —
        // row-level security governs what it can touch.
        var SUPABASE_URL = 'https://eigajoroncrqdumxqtbh.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_95SSYoy0ummfadIHR2XKbg_iMaax6LY';

        var ICONS = {
          ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>',
          err: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5"/><path d="M12 16.5h.01"/><path d="M10.3 3.9L2.9 17a2 2 0 0 0 1.7 3h14.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>',
          mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>',
          lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="9.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
        };

        var badge = document.getElementById('badge');
        var title = document.getElementById('title');
        var body = document.getElementById('body');
        var openApp = document.getElementById('open-app');
        var hint = document.getElementById('hint');
        var form = document.getElementById('reset-form');
        var passwordInput = document.getElementById('password');
        var confirmInput = document.getElementById('confirm');
        var formError = document.getElementById('form-error');
        var saveButton = document.getElementById('save');

        var params = new URLSearchParams(window.location.search);
        var code = params.get('code');
        var tokenHash = params.get('token_hash');
        var errorCode = params.get('error_code') || params.get('error');
        var errorDescription = params.get('error_description');
        var isReset = params.get('type') === 'recovery';
        var openAppUrl = params.get('open');
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        var client = null;

        // Deep link into the app. `open` is embedded by the app at send time —
        // Expo Go needs its exp:// dev-server URL, a build uses expns://.
        function appUrl(path) {
          return (openAppUrl || 'expns://' + path) + '?code=' + encodeURIComponent(code);
        }

        function render(className, icon, heading, copy, options) {
          options = options || {};
          badge.className = 'badge' + (className ? ' ' + className : '');
          badge.innerHTML = ICONS[icon];
          title.textContent = heading;
          body.textContent = copy;
          document.title = heading + ' · Expns';
          form.hidden = true;
          hint.hidden = true;
          hint.textContent = '';
          if (options.link) {
            openApp.href = options.link;
            openApp.hidden = false;
            openApp.addEventListener('click', function () {
              // If the app didn't take over after the tap, the browser blocked
              // the link (in-app browsers do this) — show the workaround.
              window.setTimeout(function () {
                if (!document.hidden) {
                  hint.textContent =
                    'Nothing happened? Open this page in Safari or Chrome (menu ⋮ → Open in Browser) and tap again.';
                  hint.hidden = false;
                }
              }, 2000);
            });
          } else {
            openApp.hidden = true;
          }
          if (options.hint) {
            hint.textContent = options.hint;
            hint.hidden = false;
          }
        }

        function showError(heading, copy) {
          render('err', 'err', heading, copy, {});
        }

        function setFormError(message) {
          formError.textContent = message;
          formError.hidden = !message;
        }

        function showForm() {
          badge.className = 'badge';
          badge.innerHTML = ICONS.lock;
          title.textContent = 'New password';
          body.textContent = 'Choose a new password for your Expns account.';
          document.title = 'New password · Expns';
          openApp.hidden = true;
          hint.hidden = true;
          hint.textContent = '';
          setFormError('');
          form.hidden = false;
          passwordInput.focus();
        }

        function beginReset() {
          render('', 'lock', 'Checking your link…', 'This will only take a second.', {});

          if (!window.supabase || typeof window.supabase.createClient !== 'function') {
            showError(
              'Something went wrong',
              'Could not reach the password service. Check your connection and reload this page.'
            );
            return;
          }

          // No persistence — the session lives only while this page is open.
          client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
          });

          client.auth
            .verifyOtp({ type: 'recovery', token_hash: tokenHash })
            .then(function (result) {
              if (result.error) {
                showError(
                  'Link expired',
                  'This reset link has expired or was already used. Request a new one from the app.'
                );
                return;
              }
              showForm();
            })
            .catch(function () {
              showError('Something went wrong', 'Check your connection and reload this page.');
            });
        }

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          var password = passwordInput.value;
          if (password.length < 6) {
            setFormError('Password must be at least 6 characters.');
            return;
          }
          if (password !== confirmInput.value) {
            setFormError("Passwords don't match.");
            return;
          }
          if (!client) {
            setFormError('Something went wrong. Reload this page and try again.');
            return;
          }
          setFormError('');
          saveButton.disabled = true;
          saveButton.textContent = 'Saving…';
          client.auth
            .updateUser({ password: password })
            .then(function (result) {
              if (result.error) {
                saveButton.disabled = false;
                saveButton.textContent = 'Save new password';
                setFormError(result.error.message || "Couldn't save the new password. Try again.");
                return;
              }
              render(
                'ok',
                'ok',
                'Password updated',
                'Open the Expns app and log in with your new password.',
                {}
              );
              // The browser session isn't needed any more.
              client.auth.signOut().catch(function () {});
            })
            .catch(function () {
              saveButton.disabled = false;
              saveButton.textContent = 'Save new password';
              setFormError('Check your connection and try again.');
            });
        });

        if (errorCode) {
          var expired = errorCode === 'otp_expired';
          render(
            'err',
            'err',
            expired ? 'Link expired' : 'Something went wrong',
            expired
              ? isReset
                ? 'This reset link has expired or was already used. Request a new one from the app.'
                : 'This confirmation link has expired or was already used. Open the app and sign up again to get a fresh one.'
              : errorDescription ||
                (isReset
                  ? "That link didn't work. Request a new reset link from the app."
                  : "That link didn't work. Open the app and sign up again."),
            {}
          );
        } else if (isReset && tokenHash) {
          beginReset();
        } else if (isReset) {
          // Recovery links from before the in-browser flow — they carry a
          // `?code=` that only the app that requested it could exchange.
          render(
            'err',
            'err',
            'Request a new link',
            'This reset link was sent by an older version of Expns. Request a new one from the app — it opens the form right here.',
            {}
          );
        } else if (code) {
          render(
            'ok',
            'ok',
            'Email verified',
            'Your Expns account is ready to go.',
            isMobile
              ? {
                  link: appUrl('auth/confirm'),
                  hint: 'Opens the app and signs you in.',
                }
              : { hint: 'Open the Expns app on your phone and log in to get started.' }
          );
        } else {
          render(
            'mail',
            'mail',
            'Verify your email',
            'This page handles email links from Expns. Open the link from your inbox.',
            {}
          );
        }
      })();
    </script>
  </body>
</html>
